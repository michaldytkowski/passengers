<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08122e">
<meta name="mobile-web-app-capable" content="yes">
<title>PASSENGERS — demo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sky">
  <button class="audio-btn book-btn" id="bookBtn" aria-label="Kolekcja postaci">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 8c-3-2-7-2.6-11-2v18c4-.6 8 0 11 2 3-2 7-2.600 11-2V6c-4-.6-8 0-11 2z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 8v18" stroke="currentColor" stroke-width="2.4"/><path d="M8 11c2-.2 4 0 6 .8M8 16c2-.2 4 0 6 .8M18 11.8c2-.8 4-1 6-.8M18 16.8c2-.8 4-1 6-.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".7"/></svg>
    <span class="badge" id="bookBadge" hidden>0</span>
  </button>
  <div class="collect-toast" id="collectToast" aria-live="polite"></div>
  <div class="codex" id="codex" hidden role="dialog" aria-modal="true" aria-label="Kolekcja postaci">
    <div class="codex-card">
      <header><h2>COLLECTION</h2><span id="codexCount">0 / 0</span><button class="codex-x" id="codexClose" aria-label="Zamknij">✕</button></header>
      <div class="codex-bar"><i id="codexBar"></i></div>
      <div class="codex-grid" id="codexGrid"></div>
      <footer>Odkryj bezpieczne miejsce, aby dodać pasażera do kolekcji.</footer>
    </div>
  </div>
  <div class="audio" id="audio">
    <button class="audio-btn" id="audioBtn" aria-label="Dźwięk" aria-expanded="false" aria-controls="audioPop">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 12h6l8-6v20l-8-6H4z" fill="currentColor"/><g class="waves" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M22 11c2 2.4 2 7.6 0 10"/><path d="M25.5 7.5c4 4.5 4 12.5 0 17"/></g><path class="x" d="M22 11l7 10M29 11l-7 10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
    <div class="audio-pop" id="audioPop" hidden>
      <label><span>Music</span><input type="range" id="volMusic" min="0" max="100" step="1"><output id="pctMusic">0%</output></label>
      <label><span>Effects</span><input type="range" id="volEffects" min="0" max="100" step="1"><output id="pctEffects">0%</output></label>
    </div>
  </div>

  <div class="wing left">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="wgleft" x1="0" x2="1"><stop offset="0" stop-color="#22397f"/><stop offset="1" stop-color="#3b57a8"/></linearGradient></defs>
      <path d="M100 26 L8 58 Q2 60 2 64 L2 70 L100 56 Z" fill="url(#wgleft)" stroke="#0b1432" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <path d="M100 56 L56 62.3 L56 58.9 L100 50 Z M48 63.4 L10 68.9 L10 65.5 L48 60 Z" fill="rgba(8,18,50,.45)"/>
      <path d="M100 34 L22 59 M100 42 L40 60" stroke="rgba(255,255,255,.14)" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"/>
      <path d="M100 26 L8 58" stroke="#f5a623" stroke-width="2.5" fill="none" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
    </svg>
    <div class="engine"></div><i class="navlight red"></i>
  </div>
  <div class="wing right">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="wgright" x1="0" x2="1"><stop offset="0" stop-color="#22397f"/><stop offset="1" stop-color="#3b57a8"/></linearGradient></defs>
      <path d="M100 26 L8 58 Q2 60 2 64 L2 70 L100 56 Z" fill="url(#wgright)" stroke="#0b1432" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <path d="M100 56 L56 62.3 L56 58.9 L100 50 Z M48 63.4 L10 68.9 L10 65.5 L48 60 Z" fill="rgba(8,18,50,.45)"/>
      <path d="M100 34 L22 59 M100 42 L40 60" stroke="rgba(255,255,255,.14)" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"/>
      <path d="M100 26 L8 58" stroke="#f5a623" stroke-width="2.5" fill="none" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
    </svg>
    <div class="engine"></div><i class="navlight green"></i>
  </div>

  <main class="fuselage" id="fuselage"><div class="panel" id="panel">
    <header>
      <h1><img class="logo" width="1000" height="333" src="img/logo.png" alt="PASSENGERS"></h1>
      <p id="hint">DOTKNIJ, ABY ZAGRAĆ</p>
    </header>

    <section class="stats">
      <div><span class="lbl">MULTIPLIER</span><b id="mult">×1.00</b><small id="next"></small></div>
      <div><span class="lbl">PAYOUT</span><b id="payout">100</b></div>
      <div><span class="lbl">BALANCE</span><b id="balance">0</b></div>
    </section>

    <section class="flight" id="flight" aria-label="Informacje o locie">
      <div class="fid"><small>FLIGHT</small><b id="flId">PX 000</b></div>
      <div class="fcity"><b id="flFrom">---</b><span id="flFromCity"></span></div>
      <div class="route" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="currentColor" transform="rotate(90 12 12)"/></svg></div>
      <div class="fcity r"><b id="flTo">---</b><span id="flToCity"></span></div>
    </section>

    <section class="board">
      <div class="grid" id="grid"></div>
      <div class="banner" id="banner"></div>
    </section>

    <button class="cashout" id="cashout" disabled>
      <svg class="cloud cl" viewBox="0 0 160 60" aria-hidden="true"><g fill="rgba(190,100,0,.32)"><circle cx="40" cy="40" r="22"/><circle cx="72" cy="30" r="27"/><circle cx="104" cy="42" r="20"/><rect x="18" y="42" width="104" height="22"/></g></svg>
      <span id="cashtxt">CASH OUT</span>
      <svg class="cloud cr" viewBox="0 0 160 60" aria-hidden="true"><g fill="rgba(190,100,0,.32)"><circle cx="40" cy="40" r="22"/><circle cx="72" cy="30" r="27"/><circle cx="104" cy="42" r="20"/><rect x="18" y="42" width="104" height="22"/></g></svg>
      <svg class="plane" viewBox="0 0 48 32" aria-hidden="true"><path d="M2 20h14M6 26h12M0 14h10" stroke="#fff3b8" stroke-width="2.2" stroke-linecap="round" opacity=".8"/><g transform="translate(18 -2) rotate(38 12 12) scale(1.15)"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="#ffe27a" stroke="#a85c00" stroke-width="1"/></g></svg>
    </button>

    <section class="menu">
      <div class="mrow">
        <div class="mlabel"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="21" cy="29" r="15" fill="#20242c" stroke="#05070c" stroke-width="2"/><circle cx="15" cy="23" r="4" fill="#fff" opacity=".35"/><path d="M30 17l5-6" stroke="#05070c" stroke-width="3" stroke-linecap="round"/><circle cx="38" cy="9" r="5" fill="#ffb02e"/><path d="M38 1v4M44 9h-4M42 3l-3 3" stroke="#ff7a1a" stroke-width="2" stroke-linecap="round"/></svg><b>BOMBS</b></div>
        <div class="segment" id="bombs"></div>
      </div>
      <div class="mrow stakerow">
        <div class="mlabel"><svg viewBox="0 0 48 48" aria-hidden="true"><g stroke="#8a4b00" stroke-width="1.5"><ellipse cx="17" cy="38" rx="13" ry="6" fill="#d9921a"/><rect x="4" y="30" width="26" height="8" fill="#f5b52a"/><ellipse cx="17" cy="30" rx="13" ry="6" fill="#ffd24d"/><rect x="4" y="22" width="26" height="8" fill="#f5b52a"/><ellipse cx="17" cy="22" rx="13" ry="6" fill="#ffd24d"/><circle cx="34" cy="31" r="11" fill="#ffd24d"/><circle cx="34" cy="31" r="6.5" fill="none"/></g></svg><b>STAKE</b></div>
        <button class="sq" id="minus" aria-label="Zmniejsz stawkę">−</button>
        <input id="stake" type="number" inputmode="numeric">
        <button class="sq" id="plus" aria-label="Zwiększ stawkę">+</button>
        <i class="sep"></i>
        <button class="sq" id="half" aria-label="Połowa stawki">½</button>
        <button class="sq" id="double" aria-label="Podwój stawkę">×2</button>
        <button class="sq wide" id="max">MAX</button>
      </div>
    </section>

    <button class="play" id="play">START ROUND</button>
    <button class="link" id="reset">Reset virtual balance</button>
  </div></main>
</div>

<script src="js/config.js"></script>
<script src="js/bombGenerator.js"></script>
<script src="js/multipliers.js"></script>
<script src="js/wallet.js"></script>
<script src="js/stake.js"></script>
<script src="js/cashout.js"></script>
<script src="js/banners.js"></script>
<script src="js/audio.js"></script>
<script src="js/characters.js"></script>
<script src="js/flights.js"></script>
<script src="js/codex.js"></script>
<script src="js/round.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
